name: Publish LinkedIn Post

on:
  schedule:
    - cron: '0 9 * * 2'  # Every Tuesday 9am UTC
    - cron: '0 9 * * 4'  # Every Thursday 9am UTC
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: 7wmU65vVm_
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.parse, datetime

          token = os.environ['LINKEDIN_ACCESS_TOKEN']
          member_id = os.environ['LINKEDIN_MEMBER_ID']
          today = datetime.date.today().isoformat()

          # Read posts file
          with open('data/linkedin-posts.txt', 'r') as f:
              lines = f.readlines()

          # Find today's post
          post_text = None
          post_line_idx = None
          for i, line in enumerate(lines):
              line = line.strip()
              if line.startswith(today + ' |'):
                  post_text = line[len(today) + 3:].strip()
                  post_line_idx = i
                  break

          if not post_text:
              print(f'No post scheduled for {today}')
              exit(0)

          print(f'Posting: {post_text[:80]}...')

          # Post to LinkedIn
          payload = {
              "author": f"urn:li:person:{member_id}",
              "lifecycleState": "PUBLISHED",
              "specificContent": {
                  "com.linkedin.ugc.ShareContent": {
                      "shareCommentary": {
                          "text": post_text
                      },
                      "shareMediaCategory": "NONE"
                  }
              },
              "visibility": {
                  "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
              }
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              'https://api.linkedin.com/v2/ugcPosts',
              data=data
          )
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Content-Type', 'application/json')
          req.add_header('X-Restli-Protocol-Version', '2.0.0')

          try:
              resp = urllib.request.urlopen(req)
              result = json.loads(resp.read())
              print(f'Posted successfully: {result}')
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f'Error {e.code}: {error_body}')
              exit(1)

          PYEOF
