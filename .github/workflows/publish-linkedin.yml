name: Publish LinkedIn Post

on:
  schedule:
    - cron: '0 10 * * 2'
    - cron: '0 10 * * 3'
    - cron: '0 10 * * 4'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_ID: 7wmU65vVm_
        run: python3 scripts/post-linkedin.py
