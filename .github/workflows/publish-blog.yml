    - cron: '0 9 6 10 *'
    - cron: '0 9 8 10 *'
    - cron: '0 9 13 10 *'
    - cron: '0 9 15 10 *'
    - cron: '0 9 20 10 *'
    - cron: '0 9 22 10 *'
    - cron: '0 9 27 10 *'
    - cron: '0 9 29 10 *'
