      - name: Add post to blog index and sitemap
        run: |
          python3 << 'PYEOF'
          import os, sys
          slug = "${{ steps.post.outputs.slug }}"
          title = "${{ steps.post.outputs.title }}"
          excerpt = "${{ steps.post.outputs.excerpt }}"
          tag = "${{ steps.post.outputs.tag }}"
          date = "${{ steps.post.outputs.date }}"
          if not slug:
              print('No slug found, skipping')
              sys.exit(0)
          with open('app/blog/page.tsx', 'r') as f:
              content = f.read()
          if slug in content:
              print(f'Already in index: {slug}')
          else:
              new_post = f"  {{\n    slug: '{slug}',\n    title: '{title}',\n    excerpt: '{excerpt}',\n    date: '{date}',\n    readTime: '10 min read',\n    tag: '{tag}',\n  }},"
              content = content.replace('const posts = [', 'const posts = [\n' + new_post)
              with open('app/blog/page.tsx', 'w') as f:
                  f.write(content)
              print(f'Added to blog index: {slug}')
          with open('app/sitemap.ts', 'r') as f:
              sitemap = f.read()
          if slug not in sitemap:
              new_entry = f"    {{ url: 'https://www.lexalytic.com/blog/{slug}', lastModified: new Date(), changeFrequency: 'monthly', priority: 0.8 }},\n"
              sitemap = sitemap.replace('  ]', new_entry + '  ]')
              with open('app/sitemap.ts', 'w') as f:
                  f.write(sitemap)
              print(f'Added to sitemap: {slug}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "auto-publish: ${{ steps.post.outputs.slug }}"
          git push
