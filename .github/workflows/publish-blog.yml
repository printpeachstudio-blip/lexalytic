            echo "excerpt=Construction businesses run on spreadsheets. Here is how to automate job cost tracking and project reporting so you can see profitability without rebuilding spreadsheets every week." >> $GITHUB_OUTPUT
            echo "tag=Excel Automation" >> $GITHUB_OUTPUT
            echo "date=September 2026" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "9" ] && [ "$DAY" = "3" ]; then
            echo "slug=staff-costs-eating-profit-how-to-track" >> $GITHUB_OUTPUT
            echo "title=Why Your Staff Costs Are Eating Your Profit — And How to Track It" >> $GITHUB_OUTPUT
            echo "excerpt=Staff costs are typically the biggest expense in any service business. Most owners know roughly what they pay out but very few can see how those costs relate to revenue each person generates." >> $GITHUB_OUTPUT
            echo "tag=Business Finance" >> $GITHUB_OUTPUT
            echo "date=September 2026" >> $GITHUB_OUTPUT
          elif [ "$MONTH" = "9" ] && [ "$DAY" = "8" ]; then
