name: Keep Alive

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 8am UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep workflows active
        run: |
          echo "Keep alive ping - $(date)" >> .github/keep-alive.log
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .github/keep-alive.log
          git diff --staged --quiet || git commit -m "chore: keep workflows active"
          git push
